  <!-- CONTACT -->
  <div id="contact" class="page">
    <div class="c-duo">
      <div class="page-inner rv">
        <div class="c-heading">Get in touch</div>
        <form class="c-form" action="https://formsubmit.co/co3.one@gmail.com" method="POST">
          <input type="hidden" name="_captcha" value="true">
          <input type="hidden" name="_subject" value="CO3 ONE Contact">
          <input type="hidden" name="_template" value="table">
          <input type="hidden" name="_next" value="https://co3.one">
          <div class="c-field">
            <label>Topic</label>
            <select name="topic" required>
              <option value="" disabled selected>Select a topic</option>
              <option value="general">General inquiry</option>
              <option value="partnership">Partnership</option>
              <option value="press">Press / media</option>
              <option value="investment">Investment</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="c-field">
            <label>Name</label>
            <input type="text" name="name" placeholder="Your name" required>
          </div>
          <div class="c-field">
            <label>Email</label>
            <input type="email" name="email" placeholder="your@email.com" required>
          </div>
          <div class="c-field">
            <label>Message</label>
            <textarea name="message" placeholder="How can we help?" rows="3" required></textarea>
          </div>
          <div class="c-submit">
            <button type="submit">Send</button>
          </div>
        </form>
      </div>
      <div class="c-socials rv">
        <a href="https://substack.com/@co3one" target="_blank" rel="noopener" aria-label="Substack">

        </a>
